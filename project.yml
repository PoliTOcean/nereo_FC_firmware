:project:
  :build_root: build
  :use_exceptions: FALSE
  :use_test_preprocessor: :none

:paths:
  :test:
    - +:tests/**
    - -:tests/support
  # Required key, kept empty: source translation units are named explicitly
  # under :files ↳ :source below, never globbed from a directory (see note
  # on that section).
  :source: []
  :include:
    - tests/support
    - Core/Inc
    # Ceedling 1.1.7's autogenerated test runner strips the directory
    # component from a test file's own user #includes (confirmed in
    # generator_test_runner.rb: "a project's own directories are exposed
    # to the compiler as a flat list of -I search paths ... rendering the
    # full path here breaks resolution instead of fixing it"). The runner
    # therefore emits a bare `#include "thruster_safe_state.h"` even
    # though the test file itself uses the repo's subdirectory-qualified
    # "safety/thruster_safe_state.h" convention. Adding the header's own
    # directory here lets that bare include resolve without changing the
    # test file's convention-matching include text.
    - Core/Inc/safety
  :support:
    - tests/support

# :files: is file-oriented (unlike the directory-oriented :paths:), which is
# how a single explicit translation unit is named without globbing all of
# Core/Src -- a directory glob would risk pulling in main.c/freertos.cpp and
# their full HAL/micro-ROS include chains (see plan 02-01 <action>).
:files:
  :source:
    - Core/Src/interpolations.c
    - Core/Src/safety/thruster_safe_state.c

:defines:
  :test: []

# Enables the "TESTED: / PASSED: / FAILED: / IGNORED:" summary block this
# phase's <verify> gates grep for (see 02-01-PLAN.md acceptance criteria) --
# without this plugin Ceedling's default runner prints a differently-shaped
# "N Tests N Failures N Ignored" line that the automated gates cannot match.
:plugins:
  :enabled:
    - report_tests_pretty_stdout
